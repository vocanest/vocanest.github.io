name:"English",navHeading:"Information",privacyNav:"Privacy Policy",termsNav:"Terms of Use",sideNote:"Clear information about your privacy and use of Vocanest.",eyebrow:"Legal information",privacyTitle:"Privacy Policy",termsTitle:"Terms of Use",privacyIntro:"How Vocanest handles information and how the application may be used.",termsIntro:"Rules and conditions that apply when using Vocanest.",languageLabel:"Language",updated:"Last updated: November 1, 2026",footer:"Legal information for Vocanest users.",loading:"Detecting language…",
privacy:`<h2>1. General Information</h2><p>This Privacy Policy also provides information about personal data processing. The data controller is Vedat Gezme. It explains what information the Vocanest mobile application processes, why it does so, and the rights available to users. The application processes account information and usage analytics to provide sign-in, measure learning-session activity, and improve Vocanest.</p><h2>2. Data Collected and Processed</h2><h3>2.1. Account Information</h3><p>Google Sign-In and Firebase Authentication are used for Google sign-in and account sessions. An email address, user ID, or technical authentication information may be processed. When you choose Google sign-in, Google provides your name, email address, profile photo URL, and Google/Firebase user identifier. The app uses these to create and display your account; account fields are stored locally on your device, while Firebase Authentication processes sign-in information.</p><h3>2.2. Usage and Analytics Data</h3><p>Firebase Analytics receives usage events to understand learning-session activity and improve the application. Events sent by the app include:</p><ul><li>Features used and screens viewed.</li><li>Navigation and interaction events.</li><li>Session information, app version, and technical device information.</li><li>Performance measurements and error logs.</li><li>Technical identifiers generated by analytics services.</li></ul><h3>2.3. Device and Technical Information</h3><p>Operating system, app version, device-related information, connection records, and error logs may be processed to support functionality, security, and performance.</p><h2>3. Purposes of Processing</h2><p>Account data is collected from Google when you choose Google sign-in and is used to create and operate your account. The app sends learning-session events to Firebase Analytics to understand usage and improve Vocanest. The legal basis for each activity must be determined and documented by the data controller under KVKK before publication. Vocanest does not use these data for advertising.</p><h2>4. Firebase and Third-Party Services</h2><p>Vocanest may use Firebase and similar services for account management, analytics, error reporting, and technical infrastructure. Depending on the services and settings, providers may process or store technical data. Google Firebase services process account authentication and analytics data. These providers may process data outside your country; see the transfer information below. More information: ${firebase}.</p><h2>5. Sharing and Transfers</h2><p>Google LLC and its Firebase services receive account and analytics data to provide authentication and analytics. Data may also be disclosed to competent authorities where legally required. Google services may process data outside Türkiye. International transfers must comply with KVKK; the controller must identify and document the transfer mechanism actually used before publishing this notice.</p><h2>6. Data Retention</h2><p>Data is retained only as long as necessary for its purposes and applicable legal obligations. When no longer needed, it is deleted, destroyed, or anonymized under applicable law. Deletion timelines for backups and third-party systems may vary.</p><h2>7. Data Security</h2><p>Appropriate technical and organizational measures are intended to protect data against unauthorized access, loss, alteration, or unlawful processing. No internet transmission or electronic storage method can guarantee absolute security.</p><h2>8. User Rights</h2><p>You may exercise your rights under Article 11 of KVKK by contacting data controller Vedat Gezme at ${mail}. State your request and provide information sufficient to verify your identity. Requests will be handled under the procedures and time limits set by law.</p><h2>9. Children's Privacy</h2><p>The application should be used in accordance with its intended audience. If children's data is processed, applicable laws and safeguards will be considered. Additional age-appropriate measures may be required if the app is intended for children or allows their use.</p><h2>10. Changes</h2><p>This policy may be updated when app features, services, or legal requirements change. The current version will be published in the application or on the relevant page. Significant changes will be communicated where appropriate.</p><h2>11. Contact</h2><p><strong>Application:</strong> Vocanest<br><strong>Data Controller / Developer:</strong> Vedat Gezme<br><strong>Email:</strong> ${mail}<br><strong>Website:</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p><h2>12. Account and Data Deletion</h2><h3>12.1. Request</h3><p>Users may request deletion through the account deletion feature in the application. If deletion cannot be completed in the app, contact ${mail}.</p><h3>12.2. What Is Deleted?</h3><p>After deletion is completed, the user's Firebase Authentication account and locally stored app data associated with the account are deleted. Other account-associated data controlled by the application is handled separately, subject to technical capabilities and legal requirements. Deleting a Firebase Authentication account does not automatically delete all data in Firestore, Firebase Storage, analytics systems, or backups. Data required by law may be retained for the required period.</p><h3>12.3. Analytics Data</h3><p>Usage analytics may be processed to improve the application. On account deletion, analytics data that can be associated with the user is assessed according to the services used and applicable law. Anonymized statistics that no longer identify a person may continue to be used in aggregated analysis where technically feasible and legally permitted.</p><h3>12.4. Contact</h3><p>For deletion assistance, contact ${mail}.</p>`,
terms:`<h2>1. General Provisions</h2><p>These Terms govern use of the Vocanest mobile application. Please read them before using the app. They do not limit rights that cannot be waived under applicable law.</p><h2>2. Scope of Services</h2><p>Vocanest provides access to features and services available in the application. Features, technical requirements, and services may be updated, modified, or discontinued over time.</p><h2>3. User Accounts and Security</h2><p>Users must provide accurate and up-to-date information and protect their account credentials. If you suspect unauthorized use, contact ${mail}. Unauthorized access to another person's account or actions that compromise application security are prohibited.</p><h2>4. Rules of Use</h2><p>Users agree to:</p><ul><li>Use the application in accordance with applicable laws.</li><li>Respect the rights, privacy, and safety of others.</li><li>Not damage systems, gain unauthorized access, or bypass security measures.</li><li>Not use the application for fraud, abuse, or unlawful purposes.</li><li>Not use malicious software or automation that disrupts the application.</li></ul><h2>5. Intellectual Property</h2><p>The design, software, logo, text, graphics, and other materials belong to their respective rights holders. Except as permitted by law, these materials may not be copied, distributed, modified, or used commercially without prior authorization. User-created or uploaded content is subject to applicable law and licenses.</p><h2>6. Third-Party Services</h2><p>The application may include links to or integrations with third-party services that have their own terms and privacy policies. Their availability and operation may be outside our control.</p><h2>7. Limitation of Liability</h2><p>We make reasonable efforts to maintain reliable and continuous operation. Interruptions may occur due to maintenance, technical failures, internet issues, or circumstances beyond our control. To the extent permitted by law, liability is assessed in light of the circumstances and applicable law. Nothing excludes rights or responsibilities that cannot legally be excluded.</p><h2>8. Suspension and Termination</h2><p>Account restrictions may be imposed where these terms are violated, a security risk arises, or the law requires it, subject to applicable law. Users may request account deletion, subject to legal retention obligations.</p><h2>9. Privacy and Personal Data</h2><p>Information about personal data processing is provided in the Privacy Policy and, where necessary, relevant privacy notices. Data is processed in accordance with applicable data protection law.</p><p><strong>Privacy Policy:</strong> <a href="#privacy" data-open-doc="privacy">Privacy Policy</a></p><h2>10. Changes</h2><p>These terms may be updated due to service changes or legal requirements. Significant changes will be communicated where appropriate, and the effective date will be stated in the updated version.</p><h2>11. Governing Law</h2><p>These terms are governed by the laws of the Republic of Türkiye. Mandatory consumer rights and applicable rules concerning competent authorities and courts remain unaffected.</p><h2>12. Contact</h2><p><strong>Application:</strong> Vocanest<br><strong>Developer:</strong> Vedat Gezme<br><strong>Email:</strong> ${mail}<br><strong>Website:</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p>`

name:"Türkçe",navHeading:"Bilgi bankası",privacyNav:"Gizlilik Politikası",termsNav:"Kullanım Koşulları",sideNote:"Vocanest gizliliği ve kullanımı hakkında bilgiler.",eyebrow:"Yasal bilgiler",privacyTitle:"Gizlilik Politikası",termsTitle:"Kullanım Koşulları",privacyIntro:"Vocanest'in bilgileri nasıl işlediğini ve uygulamanın nasıl kullanılabileceğini öğrenin.",termsIntro:"Vocanest kullanılırken geçerli olan kurallar ve koşullar.",languageLabel:"Dil",updated:"Son güncelleme: 1 Kasım 2026",footer:"Vocanest kullanıcıları için yasal bilgiler.",loading:"Cihaz dili algılanıyor…",
privacy:`<h2>1. Genel Bilgilendirme</h2><p>Bu Gizlilik Politikası aynı zamanda kişisel verilerin işlenmesine ilişkin aydınlatma bilgisini içerir. Veri sorumlusu Vedat Gezme’dir. Bu metin, Vocanest mobil uygulamasında hangi bilgilerin hangi amaçlarla işlendiğini ve kullanıcı haklarını açıklar. Uygulama; Google ile oturum açmayı sağlamak, öğrenme oturumlarının kullanımını ölçmek ve Vocanest’i geliştirmek için hesap bilgilerini ve kullanım analitiğini işler.</p><h2>2. Toplanan ve İşlenen Veriler</h2><h3>2.1. Hesap Bilgileri</h3><p>Hesap ve oturum işlemleri için Firebase Authentication kullanılabilir. E-posta adresi, kullanıcı kimliği veya kimlik doğrulamayla ilişkili teknik bilgiler işlenebilir. Google ile giriş yaptığınızda Google’dan adınız, e-posta adresiniz, profil fotoğrafı bağlantınız ve Google/Firebase kullanıcı kimliğiniz alınır. Bunlar hesabınızı oluşturmak ve uygulamada göstermek için kullanılır; hesap bilgileri cihazınızda yerel olarak saklanır, oturum doğrulamasında Firebase Authentication kullanılır.</p><h3>2.2. Kullanım ve Analitik Veriler</h3><p>Firebase Analytics, öğrenme oturumlarının kullanımını anlamak ve uygulamayı geliştirmek için kullanım olayları alır. Uygulamanın gönderdiği oturum olayları; oturum süresi, öğrenme kartı ileri/geri kaydırma sayısı, oyun modu, paket kimliği ve çalışma alanı kimliğini içerebilir. Firebase Analytics ayrıca kendi SDK’sı kapsamında teknik kullanım verileri ve tanımlayıcılar işleyebilir.</p><h3>2.3. Cihaz ve Teknik Bilgiler</h3><p>Uygulamanın işlevselliği, güvenliği ve performansı için işletim sistemi, uygulama sürümü, cihaz bilgileri, bağlantı kayıtları ve hata kayıtları işlenebilir.</p><h2>3. İşleme Amaçları</h2><p>Google ile girişte hesap bilgileri doğrudan Google’dan alınır ve hesabı oluşturup işletmek için kullanılır. Uygulama, öğrenme oturumu olaylarını kullanımın anlaşılması ve Vocanest’in geliştirilmesi için Firebase Analytics’e gönderir. Her faaliyet için uygulanacak KVKK hukuki sebebi veri sorumlusu tarafından yayımdan önce belirlenip belgelenmelidir. Vocanest bu verileri reklam amacıyla kullanmaz.</p><h2>4. Firebase ve Üçüncü Taraf Hizmetler</h2><p>Vocanest hesap yönetimi, analitik, hata raporlama ve teknik altyapı için Firebase ve benzeri hizmetleri kullanabilir. Ayarlara göre hizmet sağlayıcılar teknik verileri işleyebilir veya saklayabilir. Hesap doğrulama ve analitik verileri Google Firebase hizmetleri tarafından işlenir. Bu hizmet sağlayıcıları verileri Türkiye dışında işleyebilir; aktarım hakkında aşağıdaki açıklamaya bakın. Ayrıntı: ${firebase}.</p><h2>5. Paylaşım ve Aktarım</h2><p>Google LLC ve Firebase hizmetleri, hesap ve analitik verilerini kimlik doğrulama ve analitik hizmetlerini sunmak için alır. Kanunen gerekli hâllerde yetkili mercilerle de paylaşılabilir. Google hizmetleri verileri Türkiye dışında işleyebilir. Yurt dışına aktarım KVKK’ya uygun olmalı; veri sorumlusu yayımdan önce fiilen kullanılan aktarım mekanizmasını belirleyip belgelemelidir.</p><h2>6. Saklama Süresi</h2><p>Veriler, işleme amaçları ve yasal saklama yükümlülükleri için gerekli süre boyunca tutulur. Gereklilik sona erdiğinde mevzuata uygun olarak silinir, yok edilir veya anonimleştirilir. Yedekler ve üçüncü taraf sistemlerinde silme süreleri farklı olabilir.</p><h2>7. Veri Güvenliği</h2><p>Verileri yetkisiz erişim, kayıp, değişiklik ve hukuka aykırı işlemeye karşı korumak için uygun teknik ve idari tedbirler hedeflenir. İnternet aktarımı veya elektronik saklama mutlak güvenlik garantisi vermez.</p><h2>8. Kullanıcı Hakları</h2><p>KVKK’nın 11. maddesi kapsamındaki haklarınız için veri sorumlusu Vedat Gezme’ye ${mail} adresinden başvurabilirsiniz. Başvurunuzda talebinizi ve kimliğinizi doğrulamaya yetecek bilgileri belirtin. Başvurular mevzuattaki usul ve süreler çerçevesinde yanıtlanır.</p><h2>9. Çocukların Gizliliği</h2><p>Vocanest şu anda çocuklara özel bir hizmet olarak tasarlanmamıştır. Uygulama çocuklara sunulacaksa yaşa uygun ek bilgilendirme ve koruma önlemleri uygulanmalıdır.</p><h2>10. Değişiklikler</h2><p>Uygulama, hizmetler veya yasal gereklilikler değiştiğinde politika güncellenebilir. Güncel sürüm uygulamada veya ilgili sayfada yayımlanır; önemli değişiklikler uygun olduğunda bildirilir.</p><h2>11. İletişim</h2><p><strong>Uygulama:</strong> Vocanest<br><strong>Veri Sorumlusu / Geliştirici:</strong> Vedat Gezme<br><strong>E-posta:</strong> ${mail}<br><strong>Web sitesi:</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p><h2>12. Hesap ve Verilerin Silinmesi</h2><h3>12.1. Talep</h3><p>Kullanıcılar uygulamadaki hesap silme özelliğini kullanabilir. Uygulama içinden silme tamamlanamıyorsa ${mail} adresinden ulaşabilirler.</p><h3>12.2. Neler Silinir?</h3><p>İşlem tamamlandığında Firebase Authentication hesabı ve cihazda yerel olarak saklanan hesap bağlantılı uygulama verileri silinir. Uygulamanın kontrolündeki diğer ilişkili veriler teknik imkânlar ve yasal gerekliliklere göre ayrıca ele alınır. Firebase Authentication hesabının silinmesi Firestore, Firebase Storage, analitik sistemleri veya yedeklerdeki tüm verileri otomatik silmez. Kanunen saklanması gereken veriler gerekli süre boyunca tutulabilir.</p><h3>12.3. Analitik Veriler</h3><p>Analitik veriler uygulamayı geliştirmek için işlenebilir. Hesap silindiğinde kullanıcıyla ilişkilendirilebilen veriler kullanılan hizmetler ve mevzuata göre değerlendirilir. Kimliği belirlenemeyen anonim istatistikler, teknik ve hukuki olarak mümkün olduğu ölçüde toplu analizlerde kullanılabilir.</p><h3>12.4. İletişim</h3><p>Silme desteği için ${mail} adresine yazın.</p>`,
terms:`<h2>1. Genel Hükümler</h2><p>Bu Kullanım Koşulları Vocanest mobil uygulamasının kullanımını düzenler. Uygulamayı kullanmadan önce koşulları okuyun. Bu metin, yürürlükteki mevzuat uyarınca vazgeçilemeyen hakları sınırlamaz.</p><h2>2. Hizmetin Kapsamı</h2><p>Vocanest, uygulamada sunulan özelliklere ve hizmetlere erişim sağlar. Özellikler, teknik gereklilikler ve hizmet kapsamı zaman içinde güncellenebilir, değiştirilebilir veya sonlandırılabilir.</p><h2>3. Kullanıcı Hesabı ve Güvenlik</h2><p>Kullanıcılar doğru ve güncel bilgi vermeli, hesap bilgilerini korumalıdır. Yetkisiz kullanım şüphesinde ${mail} adresinden iletişime geçin. Başkasının hesabına izinsiz erişmek veya uygulama güvenliğini tehlikeye atmak yasaktır.</p><h2>4. Kullanım Kuralları</h2><ul><li>Uygulamayı yürürlükteki mevzuata uygun kullanmak.</li><li>Başkalarının haklarına, gizliliğine ve güvenliğine saygı göstermek.</li><li>Sistemlere zarar vermemek, izinsiz erişmemek veya güvenlik önlemlerini aşmamak.</li><li>Dolandırıcılık, kötüye kullanım veya hukuka aykırı amaçlarla kullanmamak.</li><li>Uygulamayı bozan zararlı yazılımlar veya otomasyon kullanmamak.</li></ul><h2>5. Fikri Mülkiyet</h2><p>Tasarım, yazılım, logo, metin, grafik ve diğer materyaller ilgili hak sahiplerine aittir. Kanunen izin verilen durumlar dışında önceden izin alınmadan kopyalanamaz, dağıtılamaz, değiştirilemez veya ticari amaçla kullanılamaz. Kullanıcı içerikleri yürürlükteki mevzuata ve ilgili lisanslara tabidir.</p><h2>6. Üçüncü Taraf Hizmetler</h2><p>Uygulama, kendi koşulları ve gizlilik politikaları bulunan üçüncü taraf hizmetlerine bağlantı veya entegrasyon içerebilir. Bu hizmetlerin kullanılabilirliği ve işleyişi kontrolümüz dışında olabilir.</p><h2>7. Sorumluluğun Sınırlandırılması</h2><p>Güvenilir ve kesintisiz çalışma için makul çaba gösterilir. Bakım, teknik arıza, internet sorunları veya kontrol dışı durumlar kesintiye neden olabilir. Kanunen izin verilen ölçüde sorumluluk, koşullar ve mevzuat ışığında değerlendirilir. Kanunen kaldırılamayan hak ve sorumluluklar saklıdır.</p><h2>8. Hesabın Askıya Alınması ve Sonlandırılması</h2><p>Koşulların ihlali, güvenlik riski veya yasal zorunluluk hâlinde mevzuata uygun kısıtlamalar uygulanabilir. Kullanıcılar yasal saklama yükümlülükleri saklı kalmak üzere hesap silme talep edebilir.</p><h2>9. Gizlilik ve Kişisel Veriler</h2><p>Kişisel verilerin işlenmesi Gizlilik Politikası'nda ve gerektiğinde ilgili aydınlatma metinlerinde açıklanır. Veriler yürürlükteki mevzuata uygun işlenir.</p><p><strong>Gizlilik Politikası:</strong> <a href="#privacy" data-open-doc="privacy">Gizlilik Politikası</a></p><h2>10. Değişiklikler</h2><p>Koşullar hizmet veya mevzuat değişiklikleri nedeniyle güncellenebilir. Önemli değişiklikler uygun olduğunda bildirilir ve yürürlük tarihi güncel metinde belirtilir.</p><h2>11. Uygulanacak Hukuk</h2><p>Bu koşullar Türkiye Cumhuriyeti hukukuna tabidir. Tüketicilerin emredici hakları ile yetkili mercilere ilişkin kurallar saklıdır.</p><h2>12. İletişim</h2><p><strong>Uygulama:</strong> Vocanest<br><strong>Geliştirici:</strong> Vedat Gezme<br><strong>E-posta:</strong> ${mail}<br><strong>Web sitesi:</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p>`

fr:{privacy:`<h2>1. Informations générales</h2><p>Cette politique explique comment les informations relatives aux utilisateurs de Vocanest sont traitées et protégées. L’application peut traiter des données techniques et d’utilisation nécessaires à ses fonctions, à l’évaluation de ses performances et à l’amélioration de l’expérience.</p><h2>2. Données traitées</h2><h3>2.1. Compte</h3><p>Firebase Authentication peut être utilisé pour les comptes et les connexions. L’adresse e-mail, l’identifiant utilisateur et des informations techniques d’authentification peuvent être traités. Lors de la connexion Google, le nom, l’adresse e-mail, l’URL de la photo de profil et l’identifiant Google/Firebase sont reçus pour créer et afficher le compte; les champs du compte sont stockés localement sur l’appareil.</p><h3>2.2. Analyses</h3><p>Selon la configuration, les fonctionnalités utilisées, les écrans consultés, les interactions, les sessions, la version de l’application, les données techniques de l’appareil, les mesures de performance, les journaux d’erreurs et les identifiants analytiques peuvent être traités.</p><h3>2.3. Données techniques</h3><p>Le système d’exploitation, la version de l’application, les informations sur l’appareil, les connexions et les erreurs peuvent être traités pour assurer le fonctionnement, la sécurité et les performances.</p><h2>3. Finalités</h2><p>Les données servent à fournir les fonctions, gérer les comptes, analyser les performances, résoudre les problèmes, améliorer l’expérience, assurer la sécurité, prévenir les abus et respecter la loi. Elles sont traitées pour des finalités légitimes et déterminées.</p><h2>4. Firebase et services tiers</h2><p>Firebase et des services similaires peuvent être utilisés pour les comptes, les analyses, les rapports d’erreurs et l’infrastructure. Selon les réglages, les prestataires peuvent traiter des données techniques. Vérifiez les services utilisés et les transferts internationaux éventuels. ${firebase}</p><h2>5. Partage et transfert</h2><p>Les données ne sont pas destinées à être vendues à des fins publicitaires. Elles peuvent être partagées avec des prestataires, partenaires techniques ou autorités habilitées si nécessaire. Les transferts internationaux respectent les exigences légales applicables.</p><h2>6. Conservation</h2><p>Les données sont conservées le temps nécessaire aux finalités et obligations légales, puis supprimées, détruites ou anonymisées. Les délais des sauvegardes et systèmes tiers peuvent varier.</p><h2>7. Sécurité</h2><p>Des mesures techniques et organisationnelles appropriées sont prévues. Aucun système de transmission ou de stockage ne garantit une sécurité absolue.</p><h2>8. Droits</h2><p>Selon la loi applicable, les utilisateurs peuvent demander des informations sur le traitement, la rectification, la suppression lorsque la loi le permet et exercer leurs autres droits. Contact : ${mail}.</p><h2>9. Enfants</h2><p>Les données des enfants sont traitées en tenant compte des lois et garanties applicables. Des mesures adaptées à l’âge peuvent être nécessaires.</p><h2>10. Modifications</h2><p>Cette politique peut être mise à jour en cas de changement de l’application, des services ou de la loi. La version actuelle sera publiée dans l’application ou sur la page pertinente.</p><h2>11. Contact</h2><p><strong>Application :</strong> Vocanest<br><strong>Responsable / Développeur :</strong> Vedat Gezme<br><strong>E-mail :</strong> ${mail}<br><strong>Site :</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p><h2>12. Suppression du compte et des données</h2><h3>12.1. Demande</h3><p>La suppression peut être demandée dans l’application ou via ${mail}.</p><h3>12.2. Données supprimées</h3><p>Le compte Firebase Authentication et les données locales associées sont supprimés. Les autres données contrôlées par l’application sont traitées séparément. La suppression du compte Firebase n’efface pas automatiquement toutes les données Firestore, Firebase Storage, analytiques ou sauvegardées. Les données légalement conservées peuvent l’être pendant la durée requise.</p><h3>12.3. Analyses</h3><p>Les données analytiques associables à l’utilisateur sont évaluées selon les services utilisés et la loi. Les statistiques anonymisées peuvent continuer à être utilisées sous forme agrégée lorsque cela est légalement permis.</p><h3>12.4. Contact</h3><p>Pour toute aide : ${mail}.</p>`,
terms:`<h2>1. Dispositions générales</h2><p>Ces conditions régissent l’utilisation de Vocanest. En téléchargeant ou utilisant l’application, vous reconnaissez les avoir lues et comprises. Si vous n’êtes pas d’accord, n’utilisez pas l’application.</p><h2>2. Service</h2><p>Vocanest donne accès aux fonctionnalités de l’application. Les fonctions et services peuvent être modifiés, mis à jour ou arrêtés.</p><h2>3. Compte et sécurité</h2><p>Les utilisateurs doivent fournir des informations exactes et protéger leurs identifiants. En cas de suspicion d’accès non autorisé, contactez ${mail}. L’accès non autorisé au compte d’autrui est interdit.</p><h2>4. Règles d’utilisation</h2><ul><li>Respecter les lois applicables.</li><li>Respecter les droits, la vie privée et la sécurité d’autrui.</li><li>Ne pas endommager les systèmes ni contourner les protections.</li><li>Ne pas utiliser l’application à des fins frauduleuses ou illégales.</li><li>Ne pas utiliser de logiciels malveillants ou d’automatisations perturbatrices.</li></ul><h2>5. Propriété intellectuelle</h2><p>Les éléments de l’application appartiennent à leurs titulaires. Sauf autorisation légale, ils ne peuvent être copiés, distribués, modifiés ou utilisés commercialement sans autorisation. Les contenus des utilisateurs sont soumis à la loi et aux licences applicables.</p><h2>6. Services tiers</h2><p>L’application peut intégrer des services tiers soumis à leurs propres conditions et politiques de confidentialité. Leur disponibilité peut être hors de notre contrôle.</p><h2>7. Responsabilité</h2><p>Nous faisons des efforts raisonnables pour maintenir le service, mais des interruptions peuvent survenir. Dans les limites légales, la responsabilité est évaluée selon les circonstances. Les droits qui ne peuvent être exclus restent applicables.</p><h2>8. Suspension et résiliation</h2><p>En cas de violation, de risque de sécurité ou d’obligation légale, le compte peut être restreint conformément à la loi. La suppression reste soumise aux obligations légales de conservation.</p><h2>9. Données personnelles</h2><p>Le traitement des données est décrit dans la Politique de confidentialité et les notices pertinentes.</p><p><strong>Politique de confidentialité :</strong> <a href="#privacy" data-open-doc="privacy">Politique de confidentialité</a></p><h2>10. Modifications</h2><p>Les conditions peuvent être mises à jour. Les changements importants seront communiqués lorsque cela est approprié.</p><h2>11. Droit applicable</h2><p>Le droit de la République de Türkiye s’applique, sous réserve des droits impératifs des consommateurs et des règles de compétence applicables.</p><h2>12. Contact</h2><p><strong>Application :</strong> Vocanest<br><strong>Développeur :</strong> Vedat Gezme<br><strong>E-mail :</strong> ${mail}<br><strong>Site :</strong> <a href="https://vocanest.github.io" target="_blank" rel="noopener noreferrer">vocanest.github.io</a></p>`}

de:kind==="privacy"?"Diese Datenschutzerklärung beschreibt die Verarbeitung technischer Daten, Kontoinformationen und Nutzungsanalysen durch Vocanest. Firebase Authentication kann E-Mail-Adresse und Nutzerkennung verarbeiten. Nutzungsdaten können verwendete Funktionen, Bildschirmaufrufe, Sitzungen, Geräteinformationen, Leistungsdaten und Fehlerprotokolle umfassen. Daten dienen der Bereitstellung der Funktionen, Verbesserung der App, Sicherheit und Erfüllung gesetzlicher Pflichten. Firebase und andere Anbieter können Daten gemäß ihren Einstellungen verarbeiten. Daten werden nur so lange wie nötig und unter Beachtung gesetzlicher Pflichten gespeichert. Nutzer können ihre gesetzlichen Datenschutzrechte über vocanest@gmail.com geltend machen. Bei einer Kontolöschung werden das Firebase-Authentication-Konto und lokal gespeicherte Kontodaten gelöscht; Firestore, Firebase Storage, Analysesysteme und Backups müssen gegebenenfalls gesondert behandelt werden. Gesetzlich aufzubewahrende Daten können erhalten bleiben. Entwickler: Vedat Gezme.":"Diese Bedingungen regeln die Nutzung von Vocanest. Nutzer müssen korrekte Angaben machen, Zugangsdaten schützen, Gesetze einhalten und dürfen weder fremde Konten unbefugt nutzen noch Sicherheitssysteme umgehen, Schäden verursachen oder rechtswidrige Zwecke verfolgen. Geistiges Eigentum bleibt bei den jeweiligen Rechteinhabern. Drittanbieter unterliegen eigenen Bedingungen. Der Dienst kann aufgrund technischer Probleme unterbrochen werden; zwingende gesetzliche Rechte bleiben unberührt. Konten können bei Verstößen oder rechtlichen Anforderungen eingeschränkt werden. Datenschutzinformationen stehen in der Datenschutzerklärung. Es gilt das Recht der Republik Türkiye, vorbehaltlich zwingender Verbraucherrechte. Entwickler: Vedat Gezme; Kontakt: vocanest@gmail.com.",
ja:kind==="privacy"?"本ポリシーはVocanestにおけるアカウント情報、技術情報、利用分析データの取り扱いを説明します。Firebase AuthenticationによりメールアドレスやユーザーIDが処理される場合があります。利用データには使用機能、画面、セッション、端末情報、性能情報、エラーログなどが含まれる場合があります。データは機能提供、改善、安全確保、法的義務のために処理されます。Firebase等のサービスが設定に応じてデータを処理する場合があります。データは必要な期間保存され、利用者はvocanest@gmail.comに連絡して法令上の権利を行使できます。アカウント削除時はFirebase Authenticationアカウントと端末内の関連データを削除しますが、Firestore、Firebase Storage、分析システム、バックアップは別途処理が必要な場合があります。法令上必要なデータは保存されることがあります。開発者：Vedat Gezme。":"本規約はVocanestの利用条件を定めます。利用者は正確な情報を提供し、認証情報を安全に管理し、法令を守り、他人のアカウントへの無断アクセス、システムへの損害、セキュリティ回避、違法利用を行わないものとします。知的財産権は各権利者に帰属します。第三者サービスには独自の条件が適用されます。技術的理由でサービスが中断する場合がありますが、法的に排除できない権利は制限されません。違反や法的義務がある場合、アカウントを制限することがあります。プライバシーについてはプライバシーポリシーをご確認ください。トルコ共和国法が適用されます。開発者：Vedat Gezme、連絡先：vocanest@gmail.com。",
ko:kind==="privacy"?"본 방침은 Vocanest의 계정 정보, 기술 정보 및 이용 분석 데이터 처리 방식을 설명합니다. Firebase Authentication을 통해 이메일 주소와 사용자 ID가 처리될 수 있습니다. 이용 데이터에는 사용 기능, 화면 조회, 세션, 기기 정보, 성능 데이터 및 오류 기록이 포함될 수 있습니다. 데이터는 기능 제공, 앱 개선, 보안 및 법적 의무 이행을 위해 처리됩니다. Firebase 등 서비스 제공업체는 설정에 따라 데이터를 처리할 수 있습니다. 데이터는 필요한 기간 동안 보관되며, 이용자는 vocanest@gmail.com으로 개인정보 관련 권리를 요청할 수 있습니다. 계정 삭제 시 Firebase Authentication 계정과 로컬 관련 데이터가 삭제되지만 Firestore, Firebase Storage, 분석 시스템 및 백업은 별도 처리가 필요할 수 있습니다. 법적으로 보관해야 하는 데이터는 유지될 수 있습니다. 개발자: Vedat Gezme.":"본 약관은 Vocanest 이용 조건을 규정합니다. 이용자는 정확한 정보를 제공하고 계정 정보를 보호하며 법률을 준수해야 합니다. 타인의 계정에 무단 접근하거나 시스템을 손상하거나 보안 조치를 우회하거나 불법 목적으로 앱을 사용해서는 안 됩니다. 지식재산권은 해당 권리자에게 있습니다. 제3자 서비스에는 별도 약관이 적용됩니다. 기술 문제로 서비스가 중단될 수 있으나 법적으로 배제할 수 없는 권리는 유지됩니다. 위반 또는 법적 의무가 있는 경우 계정이 제한될 수 있습니다. 개인정보 처리 내용은 개인정보 처리방침을 참고하세요. 튀르키예 공화국 법률이 적용되며 소비자의 강행적 권리는 유지됩니다. 개발자: Vedat Gezme, 연락처: vocanest@gmail.com.",
it:kind==="privacy"?"Questa informativa descrive il trattamento dei dati dell’account, tecnici e analitici in Vocanest. Firebase Authentication può trattare indirizzo e-mail e ID utente. I dati d’uso possono comprendere funzioni utilizzate, schermate, sessioni, informazioni del dispositivo, prestazioni ed errori. I dati servono a fornire e migliorare l’app, garantire la sicurezza e rispettare gli obblighi legali. Firebase e altri fornitori possono trattare dati in base alle impostazioni. I dati sono conservati per il tempo necessario. Gli utenti possono esercitare i propri diritti scrivendo a vocanest@gmail.com. La cancellazione rimuove l’account Firebase Authentication e i dati locali associati; Firestore, Firebase Storage, analisi e backup possono richiedere procedure separate. I dati che la legge impone di conservare possono essere mantenuti. Sviluppatore: Vedat Gezme.":"Questi termini regolano l’uso di Vocanest. Gli utenti devono fornire informazioni corrette, proteggere le credenziali e rispettare la legge. È vietato accedere agli account altrui senza permesso, danneggiare sistemi, aggirare protezioni o usare l’app per scopi illeciti. La proprietà intellettuale resta ai titolari. I servizi di terzi sono soggetti alle proprie condizioni. Possono verificarsi interruzioni tecniche; restano validi i diritti inderogabili previsti dalla legge. Gli account possono essere limitati in caso di violazioni o obblighi legali. Per i dati personali si rimanda all’Informativa sulla privacy. Si applica la legge della Repubblica di Türkiye, fatti salvi i diritti inderogabili dei consumatori. Sviluppatore: Vedat Gezme; contatto: vocanest@gmail.com.",
pt:kind==="privacy"?"Esta política descreve o tratamento de dados de conta, dados técnicos e análises de utilização no Vocanest. O Firebase Authentication pode tratar o endereço de e-mail e o ID do usuário. Os dados de utilização podem incluir funcionalidades usadas, ecrãs, sessões, informações do dispositivo, desempenho e registos de erros. Os dados são utilizados para fornecer e melhorar o aplicativo, manter a segurança e cumprir obrigações legais. O Firebase e outros fornecedores podem tratar dados conforme as configurações. Os dados são conservados pelo tempo necessário. Os usuários podem exercer os seus direitos através de vocanest@gmail.com. A eliminação remove a conta Firebase Authentication e os dados locais associados; Firestore, Firebase Storage, sistemas analíticos e cópias de segurança podem exigir tratamento separado. Dados que a lei exige conservar podem ser mantidos. Desenvolvedor: Vedat Gezme.":"Estes termos regulam a utilização do Vocanest. Os usuários devem fornecer informações corretas, proteger as credenciais e cumprir a lei. É proibido aceder sem autorização a contas alheias, danificar sistemas, contornar segurança ou usar o aplicativo para fins ilícitos. A propriedade intelectual pertence aos respetivos titulares. Os serviços de terceiros têm condições próprias. Podem ocorrer interrupções técnicas, sem prejuízo dos direitos legais obrigatórios. Contas podem ser restringidas por violações ou obrigações legais. Consulte a Política de Privacidade para dados pessoais. Aplica-se a lei da República da Türkiye, sem limitar direitos obrigatórios dos consumidores. Desenvolvedor: Vedat Gezme; contacto: vocanest@gmail.com.",
ar:kind==="privacy"?"توضح هذه السياسة معالجة معلومات الحساب والبيانات التقنية والتحليلات في Vocanest. قد يعالج Firebase Authentication عنوان البريد الإلكتروني ومعرّف المستخدم. وقد تشمل بيانات الاستخدام الميزات والشاشات والجلسات ومعلومات الجهاز والأداء وسجلات الأخطاء. تُستخدم البيانات لتقديم التطبيق وتحسينه والحفاظ على الأمان والامتثال للالتزامات القانونية. قد تعالج Firebase ومقدمو الخدمات الآخرون البيانات وفق الإعدادات. تُحفظ البيانات للمدة اللازمة. يمكن للمستخدمين ممارسة حقوقهم عبر vocanest@gmail.com. عند حذف الحساب، يُحذف حساب Firebase Authentication والبيانات المحلية المرتبطة به، لكن قد يلزم حذف بيانات Firestore وFirebase Storage والتحليلات والنسخ الاحتياطية بشكل منفصل. وقد تُحفظ البيانات التي يتطلب القانون الاحتفاظ بها. المطوّر: Vedat Gezme.":"تنظم هذه الشروط استخدام Vocanest. يجب على المستخدمين تقديم معلومات صحيحة وحماية بيانات الدخول والالتزام بالقانون. يُحظر الوصول غير المصرح به إلى حسابات الآخرين أو إتلاف الأنظمة أو تجاوز الحماية أو استخدام التطبيق لأغراض غير قانونية. تعود الملكية الفكرية إلى أصحاب الحقوق. تخضع خدمات الأطراف الثالثة لشروطها الخاصة. قد تحدث انقطاعات تقنية، مع بقاء الحقوق القانونية التي لا يجوز استبعادها. قد تُقيّد الحسابات عند المخالفة أو لالتزام قانوني. يرجى مراجعة سياسة الخصوصية بشأن البيانات الشخصية. تخضع الشروط لقوانين جمهورية تركيا مع الحفاظ على حقوق المستهلك الإلزامية. المطوّر: Vedat Gezme؛ التواصل: vocanest@gmail.com."
};
 const accountNotice={de:"Bei Google-Anmeldung: Name, E-Mail, Profilbild-URL und Google/Firebase-Nutzerkennung; Kontofelder werden lokal auf dem Gerät gespeichert. Analytics-Ereignisse enthalten Sitzungsdauer, Kartenaktionen, Spielmodus sowie Paket- und Arbeitsbereichs-IDs.",ja:"Googleログイン時に氏名、メール、プロフィール画像URL、Google/FirebaseユーザーIDを取得します。アカウント項目は端末内に保存されます。分析イベントにはセッション時間、カード操作、ゲームモード、パックID、ワークスペースIDが含まれます。",ko:"Google 로그인 시 이름, 이메일, 프로필 사진 URL 및 Google/Firebase 사용자 ID를 받습니다. 계정 항목은 기기에 저장됩니다. 분석 이벤트에는 세션 시간, 카드 조작, 게임 모드, 팩 및 워크스페이스 ID가 포함됩니다.",it:"Con Google si ricevono nome, e-mail, URL della foto profilo e ID Google/Firebase; i campi account sono salvati sul dispositivo. Gli eventi Analytics includono durata sessione, azioni sulle schede, modalità di gioco e ID di pacchetto e workspace.",pt:"No acesso Google são recebidos nome, e-mail, URL da foto de perfil e ID Google/Firebase; os campos da conta são guardados no dispositivo. Os eventos Analytics incluem duração da sessão, ações nos cartões, modo de jogo e IDs do pacote e workspace.",ar:"عند تسجيل الدخول عبر Google يتم استلام الاسم والبريد ورابط صورة الملف ومعرّف Google/Firebase؛ وتُحفظ حقول الحساب على الجهاز. تشمل أحداث التحليلات مدة الجلسة والتفاعل مع البطاقات ووضع اللعبة ومعرّفات الحزمة ومساحة العمل."};
 return `<h2>${title}</h2><p>${text[lang]}</p><p>${accountNotice[code]}</p><h3>${code==="de"?"Verantwortlicher und Kontakt":code==="ja"?"管理者と連絡先":code==="ko"?"관리자 및 연락처":code==="it"?"Titolare e contatto":code==="pt"?"Responsável e contacto":"المسؤول ووسيلة التواصل"}</h3><p>${code==="de"?"Verantwortlicher: Vedat Gezme. Google LLC/Firebase verarbeitet Anmelde- und Analysedaten; eine Verarbeitung außerhalb der Türkei kann stattfinden. Die konkrete Rechtsgrundlage und der Übermittlungsmechanismus müssen vor Veröffentlichung nach KVKK festgelegt werden.":code==="ja"?"管理者：Vedat Gezme。Google LLC/Firebaseがログイン情報と分析データを処理し、トルコ国外で処理する場合があります。公開前にKVKKに基づく法的根拠と移転方法を確認してください。":code==="ko"?"관리자: Vedat Gezme. Google LLC/Firebase가 로그인 및 분석 데이터를 처리하며 터키 외부에서 처리될 수 있습니다. 게시 전에 KVKK에 따른 법적 근거와 이전 방식을 확인해야 합니다.":code==="it"?"Titolare: Vedat Gezme. Google LLC/Firebase tratta dati di accesso e analisi e può trattarli fuori dalla Turchia. Prima della pubblicazione occorre definire la base giuridica e il meccanismo di trasferimento secondo KVKK.":code==="pt"?"Responsável: Vedat Gezme. Google LLC/Firebase trata dados de autenticação e análise e pode tratá-los fora da Türkiye. Antes da publicação, devem ser definidos a base jurídica e o mecanismo de transferência conforme a KVKK.":"المسؤول: Vedat Gezme. تعالج Google LLC/Firebase بيانات تسجيل الدخول والتحليلات وقد تعالجها خارج تركيا. يجب تحديد الأساس القانوني وآلية النقل وفق KVKK قبل النشر."}</p><p><strong>${code==="ar"?"البريد الإلكتروني":"Contact"}:</strong> ${mail}</p>`;

const ORDER=["en","tr","fr","de","ja","ko","it","pt","ar"];
let language="en", docType="privacy";
const $=id=>document.getElementById(id);
function detectDeviceLanguage(){const prefs=navigator.languages?.length?navigator.languages:[navigator.language||"en"];for(const p of prefs){const c=String(p).toLowerCase().split("-")[0];if(ORDER.includes(c))return c;}return "en";}
function render(){const d=LANG[language]||EN;document.documentElement.lang=language;document.documentElement.dir=language==="ar"?"rtl":"ltr";$("languageSelect").value=language;for(const id of ["navHeading","privacyNav","termsNav","sideNote","eyebrow","languageLabel","updatedPill","footerText","loadingText"])$(id).textContent=d[id];$("pageTitle").textContent=docType==="privacy"?d.privacyTitle:d.termsTitle;$("pageIntro").textContent=docType==="privacy"?d.privacyIntro:d.termsIntro;$("documentContent").innerHTML=d[docType];document.querySelectorAll("[data-doc]").forEach(b=>b.classList.toggle("active",b.dataset.doc===docType));document.title="Vocanest | "+$("pageTitle").textContent;}
$("languageSelect").innerHTML=ORDER.map(k=>`<option value="${k}">${LANG[k].name}</option>`).join("");
$("languageSelect").addEventListener("change",e=>{language=ORDER.includes(e.target.value)?e.target.value:"en";render();});
document.querySelectorAll("[data-doc]").forEach(b=>b.addEventListener("click",()=>{docType=b.dataset.doc;render();}));$("documentContent").addEventListener("click",e=>{const link=e.target.closest("[data-open-doc]");if(link){e.preventDefault();docType=link.dataset.openDoc;render();window.scrollTo({top:0,behavior:"smooth"});}});
language=detectDeviceLanguage();render();window.setTimeout(()=>$("loading").classList.add("hide"),450);
</script></body></html>
